<footer><strong>Daisy Kyushu Dog Guide</strong><p>九州犬連れおでかけ情報メディア。※本サイトにはアフィリエイト広告を含みます。</p></footer>

<script>
const PAT_TOKEN = '';
async function fetchJson(path,fallback=[]){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return await r.json()}catch(e){console.warn(e);return fallback}}
function e(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function maps(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q||'')}

function iconFor(item={}){
  const t=String(item.type||item.category||'').toLowerCase();
  if(t.includes('ラン'))return '🐕';
  if(t.includes('カフェ'))return '☕';
  if(t.includes('公園'))return '🌳';
  if(t.includes('観光'))return '⛩️';
  if(t.includes('キャンプ'))return '⛺';
  return '🐾';
}

function cardImg(item){
  // image フィールドを優先（imageUrl も fallback として参照）
  const src = item.image || item.imageUrl || '';
  const icon = iconFor(item);
  if(src){
    return `<img class="card-img" src="${e(src)}" alt="${e(item.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="card-img-placeholder" style="display:none">${icon}</div>`;
  }
  return `<div class="card-img-placeholder">${icon}</div>`;
}

function modalImg(item){
  const src = item.image || item.imageUrl || '';
  const icon = iconFor(item);
  if(src){
    return `<img class="modal-img" src="${e(src)}" alt="${e(item.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="modal-img-placeholder" style="display:none">${icon}</div>`;
  }
  return `<div class="modal-img-placeholder">${icon}</div>`;
}

let allSpots = [];

function renderCards(list){
  const el = document.getElementById('spots-list');
  if(!el) return;
  el.innerHTML = list.map((s,i) => `
    <article class="spot-card" data-i="${i}" onclick="openModal(${i})">
      ${cardImg(s)}
      <div class="card-body">
        <span class="card-type-badge">${e(s.type||'スポット')}</span>
        <h2>${e(s.name)}</h2>
        <p class="card-area">📍 ${e(s.area||'')}</p>
        <p class="card-memo">${e(s.memo||'')}</p>
        <div class="tag-row">
          ${s.largeDog==='OK'||s.largeDog==='可'?'<span class="tag large">大型犬OK</span>':''}
          ${s.rainyOk==='OK'||s.rainyOk==='可'?'<span class="tag ok">雨の日OK</span>':''}
          ${s.indoorOk==='OK'||s.indoorOk==='可'?'<span class="tag">室内あり</span>':''}
        </div>
        <div class="btn-row">
          <button class="btn-detail" onclick="event.stopPropagation();openModal(${i})">詳細を見る →</button>
          <button class="btn-map" onclick="event.stopPropagation();window.open('${e(maps(s.mapQuery||s.name))}','_blank')">🗺️</button>
        </div>
      </div>
    </article>
  `).join('');
}

function openModal(i){
  const s = allSpots[i];
  if(!s) return;
  const tags = [
    s.type ? `<span class="tag">${e(s.type)}</span>` : '',
    s.largeDog ? `<span class="tag ${s.largeDog==='OK'||s.largeDog==='可'?'large':'warn'}">大型犬：${e(s.largeDog)}</span>` : '',
    s.rainyOk ? `<span class="tag ${s.rainyOk==='OK'||s.rainyOk==='可'?'ok':''}">雨の日：${e(s.rainyOk)}</span>` : '',
    s.indoorOk ? `<span class="tag">室内：${e(s.indoorOk)}</span>` : '',
    s.parking ? `<span class="tag">駐車場：${e(s.parking)}</span>` : '',
    s.lastChecked ? `<span class="tag ok">確認：${e(s.lastChecked)}</span>` : '',
  ].filter(Boolean).join('');

  const officialBtn = s.officialUrl
    ? `<a class="btn-official" href="${e(s.officialUrl)}" target="_blank" rel="noopener">公式サイトを見る</a>` : '';
  const mapBtn = `<a class="btn-sub" href="${e(maps(s.mapQuery||s.name))}" target="_blank" rel="noopener">🗺️ 地図で見る</a>`;
  const igBtn = s.instagramUrl
    ? `<a class="btn-sub" href="${e(s.instagramUrl)}" target="_blank" rel="noopener">📸 公式Instagram</a>` : '';

  const rakutenBanner = `
    <a class="rakuten-banner" href="https://hb.afl.rakuten.co.jp/hgc/4fecc3bd.1fb856bd.4fecc3bf.8f6158d3/?pc=https%3A%2F%2Fkw.travel.rakuten.co.jp%2Fkeyword%2FEvent.do%3Ff_category%3D3%26f_area%3D12&m=https%3A%2F%2Fkw.travel.rakuten.co.jp%2Fkeyword%2FEvent.do%3Ff_category%3D3%26f_area%3D12" target="_blank" rel="noopener sponsored">
      <span class="rb-icon">🏨</span>
      <div class="rb-text">
        <p class="rb-title">愛犬と泊まれる宿を楽天トラベルで探す</p>
        <p class="rb-sub">九州全域のペット同伴OK宿をまとめて比較 ›</p>
      </div>
    </a>`;

  document.getElementById('modal-inner').innerHTML = `
    ${modalImg(s)}
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕ 閉じる</button>
      <h2>${e(s.name)}</h2>
      <p>📍 ${e(s.area||'')}</p>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin:8px 0">${tags}</div>
      <p style="margin:12px 0;line-height:1.8">${e(s.memo||'')}</p>
      <div class="modal-actions">${officialBtn}${mapBtn}${igBtn}</div>
      <p class="notice" style="font-size:12px">犬同伴条件・大型犬可否は変更される場合があります。訪問前に必ず公式情報をご確認ください。</p>
      ${rakutenBanner}
      <a href="hotel-features.html" style="display:block;text-align:center;margin-top:8px;font-size:12px;color:#2e7d32;text-decoration:underline;">九州のペット宿 エリア別特集を見る →</a>
    </div>
  `;
  document.getElementById('detail-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('detail-modal').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('detail-modal').addEventListener('click', ev => {
  if(ev.target.id === 'detail-modal') closeModal();
});
document.addEventListener('keydown', ev => { if(ev.key === 'Escape') closeModal(); });

// フィルター
document.getElementById('filter-bar').addEventListener('click', ev => {
  const btn = ev.target.closest('.filter-btn');
  if(!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const f = btn.dataset.filter;
  let filtered = allSpots;
  if(f !== 'all'){
    if(f === '大型犬OK'){
      filtered = allSpots.filter(s => s.largeDog === 'OK' || s.largeDog === '可');
    } else {
      filtered = allSpots.filter(s =>
        String(s.type||'').includes(f) ||
        String(s.category||'').includes(f) ||
        String(s.name||'').includes(f)
      );
    }
  }
  renderCards(filtered);
});

async function init(){
  allSpots = await fetchJson('spots.json');
  document.getElementById('spot-count').textContent = allSpots.length + '件';
  renderCards(allSpots);
}
document.addEventListener('DOMContentLoaded', init);
</script>

  <script type="module">

  <script type="module">
    import { trackRakutenClick } from "firebase-tracker.js";
    // 動的に生成される楽天リンクを監視してクリック計測
    const observer = new MutationObserver(() => {
      document.querySelectorAll('a[href*="rakuten"]:not([data-rk-tracked]), a[href*="hb.afl"]:not([data-rk-tracked])').forEach(link => {
        link.dataset.rkTracked = "1";
        const href = link.href;
        const hotelMatch = href.match(/HOTEL\/(\d+)/);
        let itemId = hotelMatch ? `hotel_${hotelMatch[1]}` : `rk_${href.slice(-20).replace(/[^a-z0-9]/gi,'_')}`;
        let itemTitle = link.closest('[data-hotel-name]')?.dataset.hotelName || link.textContent.trim() || itemId;
        let itemType = hotelMatch ? 'hotel' : (link.closest('.rk-banner') ? 'banner' : 'product');
        link.addEventListener('click', () => trackRakutenClick(itemId, itemTitle, itemType));
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
    // 初回実行
    document.querySelectorAll('a[href*="rakuten"]:not([data-rk-tracked]), a[href*="hb.afl"]:not([data-rk-tracked])').forEach(link => {
      link.dataset.rkTracked = "1";
      const href = link.href;
      const hotelMatch = href.match(/HOTEL\/(\d+)/);
      let itemId = hotelMatch ? `hotel_${hotelMatch[1]}` : `rk_${href.slice(-20).replace(/[^a-z0-9]/gi,'_')}`;
      let itemTitle = link.closest('[data-hotel-name]')?.dataset.hotelName || link.textContent.trim() || itemId;
      let itemType = hotelMatch ? 'hotel' : (link.closest('.rk-banner') ? 'banner' : 'product');
      link.addEventListener('click', () => trackRakutenClick(itemId, itemTitle, itemType));
    });
  </script>
