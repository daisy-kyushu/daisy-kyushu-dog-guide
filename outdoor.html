<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>犬連れアウトドア | Daisy Kyushu Dog Guide</title><meta name="description" content="九州の犬連れアウトドアスポット。高原・散策・キャンプ・ドライブなど大型犬OKの自然スポットを厳選。"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet"><style>
:root{--bg:#fffdf8;--cream:#fff4df;--mint:#cfeee0;--green:#4f8c6b;--brown:#44352a;--muted:#7d7168;--line:#efe4d5;--shadow:0 18px 45px rgba(84,66,45,.12);--radius:28px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 5%,rgba(207,238,224,.55) 0 130px,transparent 131px),var(--bg);color:var(--brown);font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.82;font-weight:400;letter-spacing:.01em}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}
.site-header{position:sticky;top:0;z-index:10;background:rgba(255,253,248,.95);border-bottom:1px solid var(--line);padding:14px 5vw;display:flex;gap:18px;justify-content:space-between;align-items:center}
.brand{font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;font-weight:900;color:var(--brown);font-size:17px}
nav{display:flex;gap:6px;flex-wrap:wrap}nav a{font-size:13px;padding:7px 10px;border-radius:99px;font-weight:700}nav a:hover{background:var(--cream);text-decoration:none}
main{width:min(1120px,calc(100% - 32px));margin:0 auto}
.hero{margin:30px 0 22px;padding:clamp(24px,5vw,52px);border-radius:36px;background:linear-gradient(135deg,#cfeee0,#d4f0e8);box-shadow:var(--shadow)}
.hero h1{font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;font-size:clamp(34px,7vw,64px);line-height:1.1;margin:0 0 12px;font-weight:900;letter-spacing:.03em}
.notice{background:#fff1ed;border:1px solid #f0c7bd;border-radius:16px;padding:10px 14px;font-size:13px}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px;padding:16px;background:#fff;border-radius:20px;border:1px solid var(--line)}
.filter-btn{padding:8px 16px;border-radius:99px;border:2px solid var(--line);background:#fff;color:var(--brown);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:24px 0}
.spot-card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 4px 16px rgba(84,66,45,.08);overflow:hidden;transition:transform .22s ease,box-shadow .22s ease;cursor:pointer;display:flex;flex-direction:column}
.spot-card:hover{transform:translateY(-6px);box-shadow:0 16px 40px rgba(84,66,45,.18)}
.spot-card .card-img{width:100%;height:200px;object-fit:cover;display:block;background:var(--cream)}
.spot-card .card-img-placeholder{width:100%;height:200px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(135deg,#cfeee0,#d4f0e8);flex-shrink:0}
.spot-card .card-body{padding:16px;flex:1;display:flex;flex-direction:column}
.spot-card .card-type-badge{display:inline-block;background:var(--mint);color:#315f48;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.spot-card h2{font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;font-size:1.05rem;font-weight:700;margin:0 0 6px;line-height:1.4;color:var(--brown)}
.spot-card .card-area{font-size:12px;color:var(--muted);margin:0 0 8px}
.spot-card .card-memo{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.6;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.spot-card .tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.tag{display:inline-block;background:var(--cream);border-radius:99px;padding:4px 9px;font-size:11px;font-weight:700}
.tag.warn{background:#ffe9e4;color:#85443b}
.tag.ok{background:var(--mint);color:#315f48}
.tag.large{background:#e8f4ff;color:#2a5a8c}
.spot-card .btn-row{display:flex;gap:8px;margin-top:auto}
.btn-detail{flex:1;background:var(--green);color:#fff;border:none;border-radius:99px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;transition:background .2s;font-family:"Noto Sans JP",sans-serif}
.btn-detail:hover{background:#3d6e54}
.btn-map{background:#fff;color:var(--brown);border:1.5px solid var(--line);border-radius:99px;padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:"Noto Sans JP",sans-serif}
.btn-map:hover{background:var(--cream)}
.modal-overlay{position:fixed;inset:0;background:rgba(30,25,20,.5);display:none;z-index:99;padding:14px;overflow:auto}
.modal-overlay.open{display:block}
.modal-box{max-width:720px;margin:28px auto;background:var(--bg);border-radius:28px;overflow:hidden;box-shadow:0 24px 60px rgba(84,66,45,.25);border:1px solid var(--line)}
.modal-img{width:100%;height:260px;object-fit:cover;display:block}
.modal-img-placeholder{width:100%;height:180px;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#cfeee0,#d4f0e8)}
.modal-content{padding:22px 24px}
.modal-content h2{font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;font-size:1.5rem;font-weight:900;margin:0 0 10px}
.modal-close{float:right;background:var(--cream);border:none;border-radius:99px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;margin-left:12px;font-family:"Noto Sans JP",sans-serif}
.modal-close:hover{background:var(--line)}
.modal-actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.btn-official{background:var(--green);color:#fff;border:none;border-radius:99px;padding:11px 20px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;font-family:"Noto Sans JP",sans-serif}
.btn-official:hover{background:#3d6e54;text-decoration:none;color:#fff}
.btn-sub{background:#fff;color:var(--brown);border:1.5px solid var(--line);border-radius:99px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;font-family:"Noto Sans JP",sans-serif}
.btn-sub:hover{background:var(--cream);text-decoration:none}
.rakuten-banner{background:linear-gradient(135deg,#bf0000,#e60012);border-radius:16px;padding:14px 18px;margin:16px 0;display:flex;align-items:center;gap:14px;text-decoration:none;transition:opacity .2s}
.rakuten-banner:hover{opacity:.9;text-decoration:none}
.rakuten-banner .rb-icon{font-size:28px;flex-shrink:0}
.rakuten-banner .rb-text{color:#fff}
.rakuten-banner .rb-title{font-size:14px;font-weight:700;margin:0}
.rakuten-banner .rb-sub{font-size:11px;opacity:.85;margin:2px 0 0}
.count-badge{background:var(--green);color:#fff;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:700;margin-left:8px}
.product-section{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0}
.product-section h3{font-size:13px;font-weight:700;margin:0 0 10px;color:var(--muted)}
.product-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.product-item:last-child{border-bottom:none}
.product-item .p-name{font-size:13px;font-weight:700;flex:1}
.product-item .p-btn{background:var(--green);color:#fff;border:none;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap;font-family:"Noto Sans JP",sans-serif}
footer{margin-top:50px;padding:28px 5vw;border-top:1px solid var(--line);background:#fff;color:var(--muted)}
@media(max-width:900px){.site-header{display:block}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.hero h1{font-size:36px}main{width:min(100% - 20px,1120px)}.spot-card .card-img,.spot-card .card-img-placeholder{height:180px}}
</style></head><body>
<header class="site-header"><a class="brand" href="index.html">🐾 Daisy Kyushu Dog Guide</a><nav><a href="index.html">ホーム</a><a href="weekend.html">今週末</a><a href="spots.html">スポット</a><a href="outdoor.html">アウトドア</a><a href="map.html">地図</a><a href="hotels.html">ホテル</a><a href="events.html">イベント</a><a href="checklist.html">持ち物</a></nav></header>
<main>
  <section class="hero">
    <h1>🌿 犬連れアウトドア</h1>
    <p>高原・散策・キャンプ・ドライブ…九州の自然を愛犬と一緒に！<span id="outdoor-count" class="count-badge">読み込み中...</span></p>
    <p class="notice">屋外施設でも犬同伴条件・リードルール・大型犬可否は施設ごとに異なります。訪問前に必ず公式情報をご確認ください。</p>
  </section>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" data-filter="all">すべて</button>
    <button class="filter-btn" data-filter="ハイキング">ハイキング</button>
    <button class="filter-btn" data-filter="キャンプ">キャンプ</button>
    <button class="filter-btn" data-filter="公園">公園・高原</button>
    <button class="filter-btn" data-filter="海">海・川</button>
    <button class="filter-btn" data-filter="大型犬">大型犬OK</button>
  </div>

  <section id="outdoor-list" class="grid"></section>
</main>

<footer><strong>Daisy Kyushu Dog Guide</strong><p>九州犬連れおでかけ情報メディア。※本サイトにはアフィリエイト広告を含みます。</p></footer>

<div class="modal-overlay" id="detail-modal">
  <div class="modal-box">
    <div id="modal-inner"></div>
  </div>
</div>

<script>
async function fetchJson(path,fallback=[]){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return await r.json()}catch(e){console.warn(e);return fallback}}
function e(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function maps(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q||'')}

function iconFor(item={}){
  const t=String(item.type||item.category||'').toLowerCase();
  if(t.includes('ハイキング')||t.includes('登山'))return '🥾';
  if(t.includes('キャンプ')||t.includes('グランピング'))return '⛺';
  if(t.includes('海')||t.includes('川')||t.includes('湖'))return '🌊';
  if(t.includes('高原')||t.includes('草原'))return '🌾';
  if(t.includes('公園'))return '🌳';
  return '🌿';
}

function cardImg(item){
  const src = item.image || item.imageUrl || '';
  const icon = iconFor(item);
  if(src){
    return `<img class="card-img" src="${e(src)}" alt="${e(item.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="card-img-placeholder" style="display:none">${icon}</div>`;
  }
  return `<div class="card-img-placeholder">${icon}</div>`;
}

function modalImg(item){
  const src = item.image || item.imageUrl || '';
  const icon = iconFor(item);
  if(src){
    return `<img class="modal-img" src="${e(src)}" alt="${e(item.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="modal-img-placeholder" style="display:none">${icon}</div>`;
  }
  return `<div class="modal-img-placeholder">${icon}</div>`;
}

let allOutdoor = [];

function renderCards(list){
  const el = document.getElementById('outdoor-list');
  if(!el) return;
  el.innerHTML = list.map((s,i) => `
    <article class="spot-card" onclick="openModal(${i})">
      ${cardImg(s)}
      <div class="card-body">
        <span class="card-type-badge">${e(s.type||'アウトドア')}</span>
        <h2>${e(s.name)}</h2>
        <p class="card-area">📍 ${e(s.area||'')}</p>
        <p class="card-memo">${e(s.memo||'')}</p>
        <div class="tag-row">
          ${s.largeDog==='OK'||s.largeDog==='可'?'<span class="tag large">大型犬OK</span>':''}
          ${s.dogAllowed==='OK'||s.dogAllowed==='可'?'<span class="tag ok">犬同伴OK</span>':''}
          ${s.rainyOk==='OK'||s.rainyOk==='可'?'<span class="tag ok">雨の日OK</span>':''}
        </div>
        <div class="btn-row">
          <button class="btn-detail" onclick="event.stopPropagation();openModal(${i})">詳細を見る →</button>
          <button class="btn-map" onclick="event.stopPropagation();window.open('${e(maps(s.mapQuery||s.name))}','_blank')">🗺️</button>
        </div>
      </div>
    </article>
  `).join('');
}

function openModal(i){
  const s = allOutdoor[i];
  if(!s) return;
  const tags = [
    s.type ? `<span class="tag">${e(s.type)}</span>` : '',
    s.dogAllowed ? `<span class="tag ${s.dogAllowed==='OK'||s.dogAllowed==='可'?'ok':'warn'}">犬同伴：${e(s.dogAllowed)}</span>` : '',
    s.largeDog ? `<span class="tag ${s.largeDog==='OK'||s.largeDog==='可'?'large':'warn'}">大型犬：${e(s.largeDog)}</span>` : '',
    s.rainyOk ? `<span class="tag">雨の日：${e(s.rainyOk)}</span>` : '',
    s.walkLevel ? `<span class="tag">難易度：${e(s.walkLevel)}</span>` : '',
    s.estimatedTime ? `<span class="tag">所要時間：${e(s.estimatedTime)}</span>` : '',
    s.parking ? `<span class="tag">駐車場：${e(s.parking)}</span>` : '',
    s.lastChecked ? `<span class="tag ok">確認：${e(s.lastChecked)}</span>` : '',
  ].filter(Boolean).join('');

  const officialBtn = s.officialUrl
    ? `<a class="btn-official" href="${e(s.officialUrl)}" target="_blank" rel="noopener">公式サイトを見る</a>` : '';
  const mapBtn = `<a class="btn-sub" href="${e(maps(s.mapQuery||s.name))}" target="_blank" rel="noopener">🗺️ 地図で見る</a>`;

  const rakutenBanner = `
    <a class="rakuten-banner" href="https://travel.rakuten.co.jp/yado/search/?f_area=kyushu&f_pet=1" target="_blank" rel="noopener sponsored">
      <span class="rb-icon">🏕️</span>
      <div class="rb-text">
        <p class="rb-title">愛犬と泊まれる宿を楽天トラベルで探す</p>
        <p class="rb-sub">アウトドアの帰りに泊まれる九州のペット同伴OK宿 ›</p>
      </div>
    </a>`;

  document.getElementById('modal-inner').innerHTML = `
    ${modalImg(s)}
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕ 閉じる</button>
      <h2>${e(s.name)}</h2>
      <p>📍 ${e(s.area||'')}</p>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin:8px 0">${tags}</div>
      <p style="margin:12px 0;line-height:1.8">${e(s.memo||'')}</p>
      <div class="modal-actions">${officialBtn}${mapBtn}</div>
      <p class="notice" style="font-size:12px">犬同伴条件・大型犬可否・立ち入り可能範囲は変更される場合があります。訪問前に必ず公式情報をご確認ください。</p>
      ${rakutenBanner}
    </div>
  `;
  document.getElementById('detail-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('detail-modal').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('detail-modal').addEventListener('click', ev => {
  if(ev.target.id === 'detail-modal') closeModal();
});
document.addEventListener('keydown', ev => { if(ev.key === 'Escape') closeModal(); });

document.getElementById('filter-bar').addEventListener('click', ev => {
  const btn = ev.target.closest('.filter-btn');
  if(!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const f = btn.dataset.filter;
  let filtered = allOutdoor;
  if(f !== 'all'){
    if(f === '大型犬'){
      filtered = allOutdoor.filter(s => s.largeDog === 'OK' || s.largeDog === '可');
    } else {
      filtered = allOutdoor.filter(s =>
        String(s.type||'').includes(f) ||
        String(s.name||'').includes(f) ||
        String(s.memo||'').includes(f)
      );
    }
  }
  renderCards(filtered);
});

async function init(){
  allOutdoor = await fetchJson('outdoor.json');
  document.getElementById('outdoor-count').textContent = allOutdoor.length + '件';
  renderCards(allOutdoor);
}
document.addEventListener('DOMContentLoaded', init);
</script></body></html>
