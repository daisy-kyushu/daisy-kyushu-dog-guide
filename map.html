<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地図から探す | Daisy Kyushu Dog Guide</title><meta name="description" content="サイト掲載情報のみを地図・一覧で表示。"><style>
:root{--bg:#fffdf8;--cream:#fff4df;--mint:#cfeee0;--green:#4f8c6b;--brown:#44352a;--muted:#7d7168;--line:#efe4d5;--shadow:0 18px 45px rgba(84,66,45,.12);--radius:28px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 5%,rgba(207,238,224,.55) 0 130px,transparent 131px),var(--bg);color:var(--brown);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.75}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}.site-header{position:sticky;top:0;z-index:10;background:rgba(255,253,248,.95);border-bottom:1px solid var(--line);padding:14px 5vw;display:flex;gap:18px;justify-content:space-between;align-items:center}.brand{font-weight:800;color:var(--brown)}nav{display:flex;gap:8px;flex-wrap:wrap}nav a{font-size:13px;padding:7px 9px;border-radius:99px}nav a:hover{background:var(--cream);text-decoration:none}main{width:min(1120px,calc(100% - 32px));margin:0 auto}.hero{margin:30px 0 22px;padding:clamp(24px,5vw,52px);border-radius:36px;background:linear-gradient(135deg,var(--mint),var(--cream));box-shadow:var(--shadow)}.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.1;margin:0 0 12px}.notice{background:#fff1ed;border:1px solid #f0c7bd;border-radius:16px;padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.panel{margin:18px 0;padding:20px}.tag{display:inline-block;background:var(--cream);border-radius:99px;padding:5px 10px;margin:4px;font-size:13px}.button{display:inline-block;background:var(--green);color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;margin:6px 6px 0 0}.button.sub{background:#fff;color:var(--brown);border:1px solid var(--line)}select{padding:8px;border-radius:8px;border:1px solid var(--line)}label{font-size:13px;color:var(--muted);margin-right:8px}.map-pin{background:#f6fffa;border:1px solid #b9e8cf;border-radius:12px;padding:10px;margin:8px 0}footer{margin-top:50px;padding:28px 5vw;border-top:1px solid var(--line);background:#fff;color:var(--muted)}@media(max-width:900px){.site-header{display:block}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body>
<header class="site-header"><a class="brand" href="index.html">🐾 Daisy Kyushu Dog Guide</a><nav><a href="index.html">ホーム</a><a href="weekend.html">今週末</a><a href="spots.html">スポット</a><a href="outdoor.html">アウトドア</a><a href="map.html">地図</a><a href="hotels.html">ホテル</a><a href="events.html">イベント</a><a href="checklist.html">持ち物</a></nav></header>
<main>
<section class="hero"><h1>地図から探す</h1><p>このページは<strong>サイト掲載JSON（spots / outdoor / hotels / events）だけ</strong>を表示します。</p><p class="notice">lat/lngがある情報はピン欄に表示。ない情報は一覧カード＋Google Mapsリンクで表示します。</p></section>
<section class="panel"><label>カテゴリ</label><select id="category"><option>すべて</option><option>ドッグラン</option><option>ホテル</option><option>キャンプ</option><option>アウトドア</option><option>イベント</option><option>山登り</option><option>観光スポット</option><option>公園</option><option>カフェ</option></select>
<label>タグ</label><select id="tag"><option>なし</option><option>大型犬OK</option><option>大型犬要確認</option><option>雨の日OK</option><option>室内OK</option><option>駐車場あり</option><option>今週末おすすめ</option></select></section>
<section class="panel"><h2>ピン表示（lat/lngあり）</h2><div id="pin-list"></div></section>
<section id="map-list" class="grid"></section>
</main>
<footer><strong>Daisy Kyushu Dog Guide</strong><p>九州犬連れおでかけ情報メディア。※本サイトにはアフィリエイト広告を含みます。</p></footer>
<script>
async function fetchJson(path,fallback=[]){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return await r.json()}catch(e){console.warn(e);return fallback}}
function e(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function maps(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q||'')}
function eventEnd(d){const m=String(d||'').match(/\d{4}-\d{2}-\d{2}/g);return m?m[m.length-1]:''}
let master=[];
function normalize(type,item){return {type,name:item.name,area:item.area||'要確認',category:item.category||item.type||type,dogAllowed:item.dogAllowed||'要確認',largeDog:item.largeDog||'要確認',rainyOk:item.rainyOk||'要確認',indoorOk:item.indoorOk||'要確認',parking:item.parking||'要確認',lastChecked:item.lastChecked||'要確認',memo:item.memo||'',officialUrl:item.officialUrl||item.url||'',snsUrl:item.snsUrl||'',mapQuery:item.mapQuery||item.name,mapUrl:item.mapUrl||maps(item.mapQuery||item.name),rakuten:item.rakutenTravelAffiliateUrl||item.rakutenTravelUrl||'',weekend:!!item.weekendRecommended,lat:item.lat,lng:item.lng,date:item.date||''}}
function catMatch(v,c){if(c==='すべて')return true;return (v.category+v.type).includes(c)}
function tagMatch(v,t){if(t==='なし')return true;if(t==='大型犬OK')return String(v.largeDog).includes('OK');if(t==='大型犬要確認')return String(v.largeDog).includes('要確認');if(t==='雨の日OK')return String(v.rainyOk).includes('OK');if(t==='室内OK')return String(v.indoorOk).includes('OK');if(t==='駐車場あり')return String(v.parking).includes('あり');if(t==='今週末おすすめ')return !!v.weekend;return true}
function render(){const c=document.getElementById('category').value,t=document.getElementById('tag').value;const today=new Date().toISOString().slice(0,10);const list=master.filter(v=>v.type!=='event'||(eventEnd(v.date)||'9999')>=today).filter(v=>catMatch(v,c)&&tagMatch(v,t));document.getElementById('pin-list').innerHTML=list.filter(v=>v.lat&&v.lng).map(v=>`<div class="map-pin">📍${e(v.name)} (${e(v.lat)}, ${e(v.lng)})</div>`).join('')||'<p>座標付きデータは準備中です。</p>';document.getElementById('map-list').innerHTML=list.map(v=>`<article class="card"><h2>${e(v.name)}</h2><p><span class="tag">エリア：${e(v.area)}</span><span class="tag">カテゴリ：${e(v.category)}</span><span class="tag">犬同伴：${e(v.dogAllowed)}</span><span class="tag">大型犬：${e(v.largeDog)}</span><span class="tag">雨の日：${e(v.rainyOk)}</span><span class="tag">室内：${e(v.indoorOk)}</span><span class="tag">駐車場：${e(v.parking)}</span><span class="tag">確認：${e(v.lastChecked)}</span></p><p class="notice">${e(v.memo||'参加前・訪問前に公式情報をご確認ください。')}</p>${v.officialUrl?`<a class="button" href="${e(v.officialUrl)}" target="_blank" rel="noopener">公式情報</a>`:''}<a class="button sub" href="${e(v.mapUrl||maps(v.mapQuery))}" target="_blank" rel="noopener">Google Mapsで見る</a>${v.rakuten?`<a class="button" href="${e(v.rakuten)}" target="_blank" rel="noopener">楽天トラベルで見る</a>`:''}</article>`).join('')}
(async()=>{const [spots,outdoor,hotels,events]=await Promise.all([fetchJson('spots.json'),fetchJson('outdoor.json'),fetchJson('hotels.json'),fetchJson('events.json')]);master=[...spots.map(x=>normalize('spot',x)),...outdoor.map(x=>normalize('outdoor',x)),...hotels.map(x=>normalize('hotel',x)),...events.map(x=>normalize('event',x))];document.getElementById('category').addEventListener('change',render);document.getElementById('tag').addEventListener('change',render);render();})();
</script></body></html>
