<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>地図から探す | Daisy Kyushu Dog Guide</title>
  <meta name="description" content="掲載済み情報から犬連れスポットを地図検索できます。">
  <style>
    :root{--bg:#fffdf8;--cream:#fff4df;--mint:#cfeee0;--green:#4f8c6b;--brown:#44352a;--muted:#7d7168;--line:#efe4d5;--shadow:0 18px 45px rgba(84,66,45,.12);--radius:24px}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 85% 5%,rgba(207,238,224,.55) 0 130px,transparent 131px),var(--bg);color:var(--brown);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.7}
    a{color:var(--green);text-decoration:none}
    a:hover{text-decoration:underline}
    .site-header{position:sticky;top:0;z-index:10;background:rgba(255,253,248,.95);border-bottom:1px solid var(--line);padding:14px 5vw;display:flex;gap:18px;justify-content:space-between;align-items:center}
    .brand{font-weight:800;color:var(--brown)}
    nav{display:flex;gap:8px;flex-wrap:wrap}
    nav a{font-size:13px;padding:7px 9px;border-radius:99px}
    nav a:hover{background:var(--cream);text-decoration:none}
    main{width:min(1120px,calc(100% - 32px));margin:0 auto}
    .hero{margin:30px 0 22px;padding:clamp(24px,5vw,52px);border-radius:36px;background:linear-gradient(135deg,var(--mint),var(--cream));box-shadow:var(--shadow)}
    .hero h1{font-size:clamp(34px,7vw,64px);line-height:1.1;margin:0 0 12px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:20px 0}
    .filters{display:flex;flex-wrap:wrap;gap:8px}
    .filter-btn{border:1px solid var(--line);background:#fff;color:var(--brown);padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700}
    .filter-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
    .notice{background:#fff1ed;border:1px solid #f0c7bd;border-radius:16px;padding:10px 12px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}
    .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}.media{height:120px;border-radius:12px;background:var(--cream);display:grid;place-items:center;font-size:42px;margin-bottom:10px;overflow:hidden}.media img{width:100%;height:100%;object-fit:cover;display:block}
    .tag{display:inline-block;background:var(--cream);border-radius:99px;padding:5px 10px;margin:4px;font-size:13px}
    .tag.ok{background:var(--mint);color:#315f48}
    .button{display:inline-block;background:var(--green);color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;margin:6px 6px 0 0}
    .button.sub{background:#fff;color:var(--brown);border:1px solid var(--line)}
    .empty{grid-column:1/-1}
    footer{margin-top:50px;padding:28px 5vw;border-top:1px solid var(--line);background:#fff;color:var(--muted)}
    @media(max-width:900px){.site-header{display:block}.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.grid{grid-template-columns:1fr}.hero h1{font-size:36px}main{width:min(100% - 20px,1120px)}}
  </style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html">🐾 Daisy Kyushu Dog Guide</a><nav><a href="index.html">ホーム</a><a href="weekend.html">今週末</a><a href="spots.html">スポット</a><a href="outdoor.html">アウトドア</a><a href="map.html">地図</a><a href="hotels.html">ホテル</a><a href="events.html">イベント</a><a href="checklist.html">持ち物</a><a href="pr.html">PR料金</a><a href="listing.html">掲載希望</a><a href="admin.html">運営管理</a></nav></header>
<main>
  <section class="hero">
    <h1>地図から探す</h1>
    <p>掲載済みデータのみを表示しています。地図リンク・公式情報を確認してからお出かけしてください。</p>
  </section>

  <section class="panel">
    <h2>フィルター</h2>
    <div id="filters" class="filters"></div>
    <p class="notice">lat / lng があるデータは将来のピン表示向けに保持し、現状は一覧カードからGoogle Mapsへ遷移できます。</p>
  </section>

  <section id="map-list" class="grid"></section>
</main>
<footer><strong>Daisy Kyushu Dog Guide</strong><p>九州犬連れおでかけ情報メディア。※本サイトにはアフィリエイト広告を含みます。</p></footer>
<script>
const FILTERS = ["すべて","ドッグラン","ホテル","キャンプ","アウトドア","イベント","山登り","観光スポット","公園","カフェ"];

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function mapsUrl(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q||"");}
function hasLatLng(item){return Number.isFinite(Number(item.lat)) && Number.isFinite(Number(item.lng));}
function iconFor(t=""){const k=String(t).toLowerCase();if(k.includes("ラン"))return "🐕";if(k.includes("ホテル")||k.includes("宿"))return "🏨";if(k.includes("カフェ"))return "☕";if(k.includes("アウトドア")||k.includes("キャンプ")||k.includes("公園"))return "🌿";if(k.includes("イベント"))return "🎪";if(k.includes("地図"))return "🗺️";return "🐾";}
function media(item){const icon=iconFor(item.category||item.type);if(!item.imageUrl)return `<div class="media">${icon}</div>`;return `<div class="media"><img src="${esc(item.imageUrl)}" alt="${esc(item.name||"")}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'media',textContent:'${icon}'}))"></div>`;}

async function fetchJson(path, fallback=[]){
  try{
    const r=await fetch(path,{cache:"no-store"});
    if(!r.ok) throw new Error(path);
    return await r.json();
  }catch(err){
    console.warn("fetch error", path, err);
    return fallback;
  }
}

function eventEnd(dateText){
  const m=String(dateText||"").match(/\d{4}-\d{2}-\d{2}/g);
  return m ? m[m.length-1] : "";
}

function normalizeItems(spots,outdoor,hotels,events){
  const now = new Date().toISOString().slice(0,10);
  const eventItems = events
    .filter(ev => (eventEnd(ev.date)||"0000-00-00") >= now)
    .map(ev => ({...ev, category: "イベント", source: "events.json"}));

  const spotItems = spots.map(s => ({...s, category: inferCategory(s.type,"観光スポット"), source: "spots.json"}));
  const outdoorItems = outdoor.map(o => ({...o, category: inferCategory(o.type,"アウトドア"), source: "outdoor.json"}));
  const hotelItems = hotels.map(h => ({...h, category: "ホテル", source: "hotels.json"}));

  return [...spotItems,...outdoorItems,...hotelItems,...eventItems];
}

function inferCategory(typeText, fallback){
  const text = String(typeText||"");
  if(text.includes("ドッグラン")) return "ドッグラン";
  if(text.includes("キャンプ")) return "キャンプ";
  if(text.includes("山") || text.includes("登山")) return "山登り";
  if(text.includes("公園")) return "公園";
  if(text.includes("カフェ")) return "カフェ";
  if(text.includes("アウトドア")) return "アウトドア";
  return fallback;
}

function renderFilters(active){
  const root=document.getElementById("filters");
  root.innerHTML=FILTERS.map(f=>`<button class="filter-btn ${f===active?"active":""}" data-filter="${esc(f)}">${esc(f)}</button>`).join("");
}

function cardButtons(item){
  const mapsQuery = item.mapQuery || item.searchKeyword || item.name;
  const mapsBtn = `<a class="button sub" href="${esc(mapsUrl(mapsQuery))}" target="_blank" rel="noopener">Google Mapsで見る</a>`;
  const officialBtn = item.officialUrl ? `<a class="button" href="${esc(item.officialUrl)}" target="_blank" rel="noopener">公式情報</a>` : "";
  const hotelUrl = item.rakutenTravelAffiliateUrl || item.rakutenTravelUrl;
  const hotelBtn = item.category === "ホテル" && hotelUrl ? `<a class="button" href="${esc(hotelUrl)}" target="_blank" rel="noopener">楽天トラベルを見る</a>` : "";
  const ig=item.instagramUrl ? `<a class="button sub" href="${esc(item.instagramUrl)}" target="_blank" rel="noopener">公式Instagramを見る</a>` : "";const post=item.instagramPostUrl ? `<a class="button sub" href="${esc(item.instagramPostUrl)}" target="_blank" rel="noopener">Instagram投稿を見る</a>` : "";return `${officialBtn}${ig}${post}${hotelBtn}${mapsBtn}`;
}

function renderCards(items, filterName){
  const root=document.getElementById("map-list");
  const visible = filterName === "すべて" ? items : items.filter(i=>i.category===filterName);
  if(!visible.length){
    root.innerHTML='<article class="card empty"><h2>該当データがありません</h2><p>別のフィルターを選択してください。</p></article>';
    return;
  }

  root.innerHTML = visible.map(item=>{
    const pinState = hasLatLng(item) ? "lat/lngあり（将来ピン対応）" : "lat/lngなし（一覧＋地図リンク）";
    return `<article class="card">
      ${media(item)}<h2>${esc(item.name)}</h2>
      <p>${esc(item.memo||"")}</p>
      <p>
        <span class="tag">カテゴリ：${esc(item.category)}</span>
        <span class="tag">エリア：${esc(item.area||"要確認")}</span>
        <span class="tag ok">${esc(pinState)}</span>
      </p>
      ${cardButtons(item)}
    </article>`;
  }).join("");
}

async function initMapPage(){
  const [spots,outdoor,hotels,events] = await Promise.all([
    fetchJson("spots.json"),
    fetchJson("outdoor.json"),
    fetchJson("hotels.json"),
    fetchJson("events.json")
  ]);

  const items = normalizeItems(spots,outdoor,hotels,events);
  let active="すべて";
  renderFilters(active);
  renderCards(items, active);

  document.getElementById("filters").addEventListener("click",(ev)=>{
    const btn = ev.target.closest("button[data-filter]");
    if(!btn) return;
    active = btn.dataset.filter;
    renderFilters(active);
    renderCards(items, active);
  });
}

document.addEventListener("DOMContentLoaded", initMapPage);
</script>
</body>
</html>
