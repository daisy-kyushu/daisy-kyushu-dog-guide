<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>地図から探す | Daisy Kyushu Dog Guide</title>
  <meta name="description" content="掲載済み情報から犬連れスポットを地図検索できます。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet"><style>
    :root{--bg:#fffdf8;--cream:#fff4df;--mint:#cfeee0;--green:#4f8c6b;--brown:#44352a;--muted:#7d7168;--line:#efe4d5;--shadow:0 18px 45px rgba(84,66,45,.12);--radius:24px}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 85% 5%,rgba(207,238,224,.55) 0 130px,transparent 131px),var(--bg);color:var(--brown);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.7}
    a{color:var(--green);text-decoration:none}
    a:hover{text-decoration:underline}
    .site-header{position:sticky;top:0;z-index:10;background:rgba(255,253,248,.95);border-bottom:1px solid var(--line);padding:14px 5vw;display:flex;gap:18px;justify-content:space-between;align-items:center}
    .brand{font-weight:800;color:var(--brown)}
    nav{display:flex;gap:8px;flex-wrap:wrap}
    nav a{font-size:13px;padding:7px 9px;border-radius:99px}
    nav a:hover{background:var(--cream);text-decoration:none}
    main{width:min(1120px,calc(100% - 32px));margin:0 auto}
    .hero{margin:30px 0 22px;padding:clamp(24px,5vw,52px);border-radius:36px;background:linear-gradient(135deg,var(--mint),var(--cream));box-shadow:var(--shadow)}
    .hero h1{font-size:clamp(34px,7vw,64px);line-height:1.1;margin:0 0 12px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:20px 0}
    .filters{display:flex;flex-wrap:wrap;gap:8px}
    .filter-btn{border:1px solid var(--line);background:#fff;color:var(--brown);padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700}
    .filter-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
    .notice{background:#fff1ed;border:1px solid #f0c7bd;border-radius:16px;padding:10px 12px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}
    .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}.media{height:120px;border-radius:12px;background:var(--cream);display:grid;place-items:center;font-size:42px;margin-bottom:10px;overflow:hidden}.media img{width:100%;height:100%;object-fit:cover;display:block}
    .tag{display:inline-block;background:var(--cream);border-radius:99px;padding:5px 10px;margin:4px;font-size:13px}
    .tag.ok{background:var(--mint);color:#315f48}
    .button{display:inline-block;background:var(--green);color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;margin:6px 6px 0 0}
    .button.sub{background:#fff;color:var(--brown);border:1px solid var(--line)}
    .empty{grid-column:1/-1}
    footer{margin-top:50px;padding:28px 5vw;border-top:1px solid var(--line);background:#fff;color:var(--muted)}
    @media(max-width:900px){.site-header{display:block}.grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.grid{grid-template-columns:1fr}.hero h1{font-size:36px}main{width:min(100% - 20px,1120px)}}
  
/* Daisy typography refresh */
body{font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.82}.brand,h1,h2,h3{font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;letter-spacing:.02em}.brand,h1{font-weight:900}h2,h3{font-weight:700;margin-top:0;margin-bottom:.72em}h2{line-height:1.38}h3{line-height:1.5}p,li{line-height:1.9}nav a,.button,.tag{font-family:"Noto Sans JP",system-ui,sans-serif;font-weight:700}nav a{font-size:14px;letter-spacing:.01em}.hero h1{letter-spacing:.03em;text-wrap:balance}.card h2,.card h3{line-height:1.48}.card p{font-size:.98rem}.button{font-size:14px;letter-spacing:.015em}.tag{font-size:13px;padding:6px 11px}.section h2,.panel h2{padding-bottom:.3em}.section h2::after,.panel h2::after{content:"";display:block;width:3.2rem;height:4px;border-radius:999px;background:rgba(79,140,107,.25);margin-top:.45em}@media(max-width:560px){body{line-height:1.92}nav a{font-size:14px;padding:8px 10px}.hero h1{font-size:clamp(31px,10vw,38px);line-height:1.22}h2{font-size:1.32rem}h3{font-size:1.08rem}.card p{font-size:1rem}.tag{font-size:13px;padding:6px 10px}.button{font-size:14px;padding:10px 15px}}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="index.html">🐾 Daisy Kyushu Dog Guide</a><nav><a href="index.html">ホーム</a><a href="weekend.html">今週末</a><a href="spots.html">スポット</a><a href="outdoor.html">アウトドア</a><a href="map.html">地図</a><a href="hotels.html">ホテル</a><a href="events.html">イベント</a><a href="checklist.html">持ち物</a></nav></header>
<main>
  <section class="hero">
    <h1>地図から探す</h1>
    <p>掲載済みデータのみを表示しています。地図リンク・公式情報を確認してからお出かけしてください。</p>
  </section>

  <section class="panel">
    <h2>フィルター</h2>
    <div id="filters" class="filters"></div>
    <p class="notice">lat / lng があるデータは将来のピン表示向けに保持し、現状は一覧カードからGoogle Mapsへ遷移できます。</p>
  </section>

  <section id="map-list" class="grid"></section>
</main>
<footer><strong>Daisy Kyushu Dog Guide</strong><p>九州犬連れおでかけ情報メディア。※本サイトにはアフィリエイト広告を含みます。</p></footer>
<script>
const FILTERS = ["すべて","ドッグラン","ホテル","キャンプ","アウトドア","イベント","山登り","観光スポット","公園","カフェ"];

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));}
function mapsUrl(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q||"");}
function hasLatLng(item){return Number.isFinite(Number(item.lat)) && Number.isFinite(Number(item.lng));}
function iconFor(t=""){const k=String(t).toLowerCase();if(k.includes("ラン"))return "🐕";if(k.includes("ホテル")||k.includes("宿"))return "🏨";if(k.includes("カフェ"))return "☕";if(k.includes("アウトドア")||k.includes("キャンプ")||k.includes("公園"))return "🌿";if(k.includes("イベント"))return "🎪";if(k.includes("地図"))return "🗺️";return "🐾";}function isDogrun(item={}){const s=String(item.type||'')+' '+String(item.category||'');return /ドッグラン|ラン/i.test(s)}function dogrunImage(item={}){const s=[item.type,item.category,item.name,item.memo,item.description,item.notes,item.features,item.tags,item.area].map(v=>String(v||'').toLowerCase()).join(' ');if(s.includes('サービスエリア')||s.includes('sa')||s.includes('パーキング')||s.includes('pa'))return 'assets/images/category-dogrun-sa.svg';if(s.includes('室内')||s.includes('インドア')||s.includes('屋内'))return 'assets/images/category-dogrun-indoor.svg';if(s.includes('カフェ')||s.includes('ドッグカフェ')||s.includes('カフェ併設'))return 'assets/images/category-dogrun-cafe.svg';if(s.includes('森')||s.includes('森林')||s.includes('林間')||s.includes('木陰')||s.includes('自然'))return 'assets/images/category-dogrun-forest.svg';return 'assets/images/category-dogrun.svg';}function categoryImage(item={}){const t=String(item.type||'').toLowerCase();const c=String(item.category||'').toLowerCase();const s=t+' '+c;if(isDogrun(item))return dogrunImage(item);if(s.includes('カフェ'))return 'assets/images/category-cafe.svg';if(s.includes('ホテル')||s.includes('宿'))return 'assets/images/category-hotel.svg';if(s.includes('アウトドア'))return 'assets/images/category-outdoor.svg';if(s.includes('公園')||s.includes('観光'))return 'assets/images/category-park.svg';if(s.includes('雨')||s.includes('室内'))return 'assets/images/category-rainy.svg';if(s.includes('イベント'))return 'assets/images/category-event.svg';if(s.includes('グッズ')||s.includes('持ち物'))return 'assets/images/category-goods.svg';if(s.includes('地図')||s.includes('map'))return 'assets/images/category-map.svg';return 'assets/images/category-daisy.svg';}
function media(item){const fb=categoryImage(item);const src=item.imageUrl?esc(item.imageUrl):esc(fb);const alt=esc(item.imageAlt||item.name||"地図カテゴリ画像");return `<div class="media"><img src="${src}" alt="${alt}" loading="lazy" onerror="this.onerror=null;this.src='${fb}'"></div>`;}

async function fetchJson(path, fallback=[]){
  try{
    const r=await fetch(path,{cache:"no-store"});
    if(!r.ok) throw new Error(path);
    return await r.json();
  }catch(err){
    console.warn("fetch error", path, err);
    return fallback;
  }
}

function eventEnd(dateText){
  const m=String(dateText||"").match(/\d{4}-\d{2}-\d{2}/g);
  return m ? m[m.length-1] : "";
}

function normalizeItems(spots,outdoor,hotels,events){
  const now = new Date().toISOString().slice(0,10);
  const eventItems = events
    .filter(ev => (eventEnd(ev.date)||"0000-00-00") >= now)
    .map(ev => ({...ev, category: "イベント", source: "events.json"}));

  const spotItems = spots.map(s => ({...s, category: inferCategory(s.type,"観光スポット"), source: "spots.json"}));
  const outdoorItems = outdoor.map(o => ({...o, category: inferCategory(o.type,"アウトドア"), source: "outdoor.json"}));
  const hotelItems = hotels.map(h => ({...h, category: "ホテル", source: "hotels.json"}));

  return [...spotItems,...outdoorItems,...hotelItems,...eventItems];
}

function inferCategory(typeText, fallback){
  const text = String(typeText||"");
  if(text.includes("ドッグラン")) return "ドッグラン";
  if(text.includes("キャンプ")) return "キャンプ";
  if(text.includes("山") || text.includes("登山")) return "山登り";
  if(text.includes("公園")) return "公園";
  if(text.includes("カフェ")) return "カフェ";
  if(text.includes("アウトドア")) return "アウトドア";
  return fallback;
}

function renderFilters(active){
  const root=document.getElementById("filters");
  root.innerHTML=FILTERS.map(f=>`<button class="filter-btn ${f===active?"active":""}" data-filter="${esc(f)}">${esc(f)}</button>`).join("");
}

function cardButtons(item){
  const mapsQuery = item.mapQuery || item.searchKeyword || item.name;
  const mapsBtn = `<a class="button sub" href="${esc(mapsUrl(mapsQuery))}" target="_blank" rel="noopener">Google Mapsで見る</a>`;
  const officialBtn = item.officialUrl ? `<a class="button" href="${esc(item.officialUrl)}" target="_blank" rel="noopener">公式情報</a>` : "";
  const hotelUrl = item.rakutenTravelAffiliateUrl || item.rakutenTravelUrl;
  const hotelBtn = item.category === "ホテル" && hotelUrl ? `<a class="button" href="${esc(hotelUrl)}" target="_blank" rel="noopener">楽天トラベルを見る</a>` : "";
  const ig=item.instagramUrl ? `<a class="button sub" href="${esc(item.instagramUrl)}" target="_blank" rel="noopener">公式Instagramを見る</a>` : "";const post=item.instagramPostUrl ? `<a class="button sub" href="${esc(item.instagramPostUrl)}" target="_blank" rel="noopener">Instagram投稿を見る</a>` : "";return `${officialBtn}${ig}${post}${hotelBtn}${mapsBtn}`;
}


function ensureModal(){if(document.getElementById('detail-modal'))return;const m=document.createElement('div');m.id='detail-modal';m.style.cssText='position:fixed;inset:0;background:rgba(30,25,20,.45);display:none;z-index:99;padding:14px;overflow:auto';m.innerHTML='<div style="max-width:760px;margin:28px auto;background:#fffdf8;border-radius:24px;padding:18px;border:1px solid #efe4d5;"><button id="close-detail" class="button sub" style="float:right">閉じる ✕</button><div id="modal-body" style="clear:both"></div></div>';document.body.appendChild(m);document.getElementById('close-detail').onclick=()=>m.style.display='none';m.onclick=(e)=>{if(e.target.id==='detail-modal')m.style.display='none'}}
function openModal(h){ensureModal();document.getElementById('modal-body').innerHTML=h;document.getElementById('detail-modal').style.display='block'}

function renderCards(items, filterName){
  const root=document.getElementById("map-list");
  const visible = filterName === "すべて" ? items : items.filter(i=>i.category===filterName);
  if(!visible.length){
    root.innerHTML='<article class="card empty"><h2>該当データがありません</h2><p>別のフィルターを選択してください。</p></article>';
    return;
  }

  root.innerHTML = visible.map(item=>{
    const pinState = hasLatLng(item) ? "lat/lngあり（将来ピン対応）" : "lat/lngなし（一覧＋地図リンク）";
    return `<article class="card">
      ${media(item)}<h2>${esc(item.name)}</h2>
      <p>${esc(item.memo||"")}</p>
      <p>
        <span class="tag">カテゴリ：${esc(item.category)}</span>
        <span class="tag">エリア：${esc(item.area||"要確認")}</span>
        <span class="tag ok">${esc(pinState)}</span>
      </p>
      ${cardButtons(item)}${item.source==="outdoor.json"?`<button class="button js-outdoor-detail" data-id="${esc(item.id||"")}">詳細を見る</button>`:""}
    </article>`;
  }).join("");
  [...root.querySelectorAll(".js-outdoor-detail")].forEach(btn=>btn.onclick=()=>{const item=visible.find(v=>String(v.id||"")===btn.dataset.id);if(!item)return;const fields=["type","category","dogAllowed","largeDog","rainyOk","indoorOk","parking","walkLevel","estimatedTime","pathType","shade","toilet","caution"];const tags=fields.filter(k=>item[k]).map(k=>`<span class="tag">${esc(k)}：${esc(item[k])}</span>`).join("");openModal(`<h2>${esc(item.name)}</h2><p><span class="tag">エリア：${esc(item.area||"")}</span>${tags}</p><p>${esc(item.memo||"")}</p><p class="notice">犬同伴条件・大型犬可否・立ち入り可能範囲は変更される場合があります。訪問前に必ず公式情報を確認してください。</p><div>${item.officialUrl?`<a class="button" href="${esc(item.officialUrl)}" target="_blank" rel="noopener">公式情報</a>`:""}<a class="button sub" href="${esc(mapsUrl(item.mapQuery||item.name))}" target="_blank" rel="noopener">地図で見る</a></div>`)})
}

async function initMapPage(){
  const [spots,outdoor,hotels,events] = await Promise.all([
    fetchJson("spots.json"),
    fetchJson("outdoor.json"),
    fetchJson("hotels.json"),
    fetchJson("events.json")
  ]);

  const items = normalizeItems(spots,outdoor,hotels,events);
  let active="すべて";
  renderFilters(active);
  renderCards(items, active);

  document.getElementById("filters").addEventListener("click",(ev)=>{
    const btn = ev.target.closest("button[data-filter]");
    if(!btn) return;
    active = btn.dataset.filter;
    renderFilters(active);
    renderCards(items, active);
  });
}

document.addEventListener("DOMContentLoaded", initMapPage);
</script>
</body>
</html>
