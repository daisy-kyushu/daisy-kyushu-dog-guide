<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面 | Daisy Kyushu Dog Guide</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans JP', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #0f172a, #1e293b); }
    .login-box { background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 40px 36px; width: 340px; text-align: center; }
    .login-logo { font-size: 40px; margin-bottom: 12px; }
    .login-title { font-size: 20px; font-weight: 800; color: #f1f5f9; margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: #94a3b8; margin-bottom: 28px; }
    .login-input { width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 10px; color: #f1f5f9; font-size: 15px; margin-bottom: 14px; outline: none; }
    .login-input:focus { border-color: #22c55e; }
    .login-btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #16a34a, #22c55e); border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
    .login-error { color: #f87171; font-size: 13px; margin-top: 10px; display: none; }
    #admin-screen { display: none; }
    .admin-header { background: #1e293b; border-bottom: 1px solid #334155; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .admin-brand { font-size: 16px; font-weight: 800; color: #22c55e; }
    .admin-brand span { color: #94a3b8; font-weight: 400; font-size: 13px; margin-left: 10px; }
    .logout-btn { background: #334155; border: none; color: #94a3b8; padding: 7px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .refresh-btn { background: #334155; border: none; color: #94a3b8; padding: 7px 16px; border-radius: 8px; font-size: 13px; cursor: pointer; }
    .admin-body { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .kpi-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; }
    .kpi-label { font-size: 12px; color: #64748b; margin-bottom: 6px; }
    .kpi-value { font-size: 32px; font-weight: 800; color: #f1f5f9; }
    .kpi-sub { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .kpi-icon { font-size: 22px; float: right; margin-top: -4px; }
    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .chart-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; }
    .chart-title { font-size: 14px; font-weight: 700; color: #f1f5f9; margin-bottom: 16px; }
    .chart-wrap { position: relative; height: 200px; }
    .rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .rank-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; }
    .rank-title { font-size: 14px; font-weight: 700; color: #f1f5f9; margin-bottom: 14px; }
    .rank-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #334155; }
    .rank-item:last-child { border-bottom: none; }
    .rank-num { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex-shrink: 0; }
    .rank-1 { background: #fbbf24; color: #1a1a1a; }
    .rank-2 { background: #94a3b8; color: #1a1a1a; }
    .rank-3 { background: #d97706; color: #fff; }
    .rank-n { background: #334155; color: #94a3b8; }
    .rank-name { flex: 1; font-size: 13px; color: #e2e8f0; }
    .rank-count { font-size: 13px; font-weight: 700; color: #22c55e; }
    .table-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 24px; }
    .table-title { font-size: 14px; font-weight: 700; color: #f1f5f9; margin-bottom: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; color: #64748b; border-bottom: 1px solid #334155; font-weight: 500; }
    td { padding: 10px 12px; border-bottom: 1px solid #1e293b; color: #e2e8f0; }
    tr:hover td { background: #0f172a; }
    .bar-bg { background: #334155; border-radius: 4px; height: 6px; margin-top: 4px; }
    .bar-fill { background: #22c55e; border-radius: 4px; height: 6px; }
    .loading { text-align: center; padding: 60px; color: #64748b; font-size: 14px; }
    .spinner { display: inline-block; width: 32px; height: 32px; border: 3px solid #334155; border-top-color: #22c55e; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 768px) { .kpi-grid { grid-template-columns: 1fr 1fr; } .charts-grid, .rank-grid { grid-template-columns: 1fr; } .admin-body { padding: 16px; } }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">🐾</div>
    <h1 class="login-title">管理画面</h1>
    <p class="login-sub">Daisy Kyushu Dog Guide</p>
    <input type="password" id="pw-input" class="login-input" placeholder="パスワードを入力">
    <button class="login-btn" onclick="doLogin()">ログイン</button>
    <p class="login-error" id="login-error">パスワードが違います</p>
  </div>
</div>

<div id="admin-screen">
  <header class="admin-header">
    <div class="admin-brand">🐾 管理画面<span id="last-updated"></span></div>
    <div style="display:flex;gap:10px;">
      <button class="refresh-btn" onclick="loadDashboard()">🔄 更新</button>
      <button class="logout-btn" onclick="doLogout()">ログアウト</button>
    </div>
  </header>
  <div class="admin-body">
    <div id="loading-area" class="loading">
      <div class="spinner"></div><br>データを読み込み中...
    </div>
    <div id="dashboard" style="display:none;">
      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-icon">👀</div><div class="kpi-label">総ページビュー</div><div class="kpi-value" id="kpi-total-pv">-</div><div class="kpi-sub">全期間累計</div></div>
        <div class="kpi-card"><div class="kpi-icon">📅</div><div class="kpi-label">今日のPV</div><div class="kpi-value" id="kpi-today-pv">-</div><div class="kpi-sub" id="kpi-today-date">-</div></div>
        <div class="kpi-card"><div class="kpi-icon">🛒</div><div class="kpi-label">楽天クリック総数</div><div class="kpi-value" id="kpi-total-clicks">-</div><div class="kpi-sub">全期間累計</div></div>
        <div class="kpi-card"><div class="kpi-icon">📄</div><div class="kpi-label">計測ページ数</div><div class="kpi-value" id="kpi-page-count">-</div><div class="kpi-sub">アクセスあり</div></div>
      </div>
      <div class="charts-grid">
        <div class="chart-card"><div class="chart-title">⏰ 時間帯別アクセス（全期間）</div><div class="chart-wrap"><canvas id="hourly-chart"></canvas></div></div>
        <div class="chart-card"><div class="chart-title">📊 直近7日間のPV推移</div><div class="chart-wrap"><canvas id="daily-chart"></canvas></div></div>
      </div>
      <div class="rank-grid">
        <div class="rank-card"><div class="rank-title">🏆 人気ページ TOP10（PV数）</div><div id="page-ranking"></div></div>
        <div class="rank-card"><div class="rank-title">🛒 楽天クリック TOP10</div><div id="click-ranking"></div></div>
      </div>
      <div class="table-card">
        <div class="table-title">📋 全ページ別アクセス詳細</div>
        <table><thead><tr><th>#</th><th>ページ</th><th>PV数</th><th>楽天クリック</th><th>最終アクセス</th></tr></thead><tbody id="page-table"></tbody></table>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDRVtANI251gyQjY-okPAzlSYXTGpslwnQ",
  authDomain: "daisysamoyed-86dd8.firebaseapp.com",
  projectId: "daisysamoyed-86dd8",
  storageBucket: "daisysamoyed-86dd8.firebasestorage.app",
  messagingSenderId: "1061044129374",
  appId: "1:1061044129374:web:a117a6ed94a0eb6491aecf"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const ADMIN_PASSWORD = "daisy2024admin";
let hourlyChart = null, dailyChart = null;

window.doLogin = function() {
  const pw = document.getElementById('pw-input').value;
  if (pw === ADMIN_PASSWORD) {
    sessionStorage.setItem('admin_auth', '1');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    loadDashboard();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
};

window.doLogout = function() {
  sessionStorage.removeItem('admin_auth');
  location.reload();
};

document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key === 'Enter') window.doLogin(); });

if (sessionStorage.getItem('admin_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'block';
}

window.loadDashboard = async function() {
  document.getElementById('loading-area').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
  try {
    const pageSnap = await getDocs(collection(db, "pageStats"));
    const pages = pageSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    const clickSnap = await getDocs(collection(db, "clickStats"));
    const clicks = clickSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    const dailySnap = await getDocs(collection(db, "dailyStats"));
    const dailyData = dailySnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.date > b.date ? 1 : -1).slice(-7);

    const totalPV = pages.reduce((s, p) => s + (p.totalViews || 0), 0);
    const totalClicks = clicks.reduce((s, c) => s + (c.totalClicks || 0), 0);
    const today = new Date().toISOString().split('T')[0];
    const todayData = dailyData.find(d => d.date === today);
    const todayPV = todayData?.totalViews || 0;

    document.getElementById('kpi-total-pv').textContent = totalPV.toLocaleString();
    document.getElementById('kpi-today-pv').textContent = todayPV.toLocaleString();
    document.getElementById('kpi-today-date').textContent = today;
    document.getElementById('kpi-total-clicks').textContent = totalClicks.toLocaleString();
    document.getElementById('kpi-page-count').textContent = pages.length.toLocaleString();

    const hourlyTotal = Array(24).fill(0);
    pages.forEach(p => { if (p.hourly) { for (let h = 0; h < 24; h++) hourlyTotal[h] += p.hourly['h'+h] || 0; } });

    const ctx1 = document.getElementById('hourly-chart').getContext('2d');
    if (hourlyChart) hourlyChart.destroy();
    hourlyChart = new Chart(ctx1, {
      type: 'bar',
      data: { labels: Array.from({length:24},(_,i)=>i+'時'), datasets: [{ data: hourlyTotal, backgroundColor: hourlyTotal.map((_,i) => i>=6&&i<12?'#22c55e':i>=12&&i<18?'#3b82f6':i>=18&&i<22?'#f59e0b':'#475569'), borderRadius: 4 }] },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:'#64748b',font:{size:10}},grid:{color:'#1e293b'}}, y:{ticks:{color:'#64748b',font:{size:10}},grid:{color:'#334155'}} } }
    });

    const ctx2 = document.getElementById('daily-chart').getContext('2d');
    if (dailyChart) dailyChart.destroy();
    dailyChart = new Chart(ctx2, {
      type: 'line',
      data: { labels: dailyData.map(d=>d.date.slice(5)), datasets: [{ data: dailyData.map(d=>d.totalViews||0), borderColor:'#22c55e', backgroundColor:'rgba(34,197,94,.1)', fill:true, tension:0.4, pointBackgroundColor:'#22c55e' }] },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ticks:{color:'#64748b',font:{size:11}},grid:{color:'#334155'}}, y:{ticks:{color:'#64748b',font:{size:11}},grid:{color:'#334155'}} } }
    });

    const sortedPages = [...pages].sort((a,b)=>(b.totalViews||0)-(a.totalViews||0));
    const sortedClicks = [...clicks].sort((a,b)=>(b.totalClicks||0)-(a.totalClicks||0));

    function renderRanking(id, items, key, unit) {
      const el = document.getElementById(id);
      if (!items.length) { el.innerHTML='<p style="color:#64748b;font-size:13px;padding:12px 0;">データがまだありません</p>'; return; }
      el.innerHTML = items.map((item,i) => {
        const nc = i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'rank-n';
        const name = (item.title||item.id).slice(0,22);
        return '<div class="rank-item"><div class="rank-num '+nc+'">'+(i+1)+'</div><div class="rank-name">'+name+'</div><div class="rank-count">'+((item[key]||0).toLocaleString())+' '+unit+'</div></div>';
      }).join('');
    }
    renderRanking('page-ranking', sortedPages.slice(0,10), 'totalViews', 'PV');
    renderRanking('click-ranking', sortedClicks.slice(0,10), 'totalClicks', 'クリック');

    const maxPV = Math.max(...sortedPages.map(p=>p.totalViews||0), 1);
    document.getElementById('page-table').innerHTML = sortedPages.map((p,i) => {
      const pv = p.totalViews||0;
      const rc = Object.values(p.rakutenClicks||{}).reduce((s,v)=>s+v,0);
      const ls = p.lastSeen?.toDate?.()?.toLocaleDateString('ja-JP')||'-';
      const bw = Math.round((pv/maxPV)*100);
      return '<tr><td style="color:#64748b;">'+(i+1)+'</td><td><div style="font-weight:500;">'+(p.title||p.id).slice(0,30)+'</div><div style="font-size:11px;color:#64748b;">'+p.id+'</div><div class="bar-bg"><div class="bar-fill" style="width:'+bw+'%"></div></div></td><td style="font-weight:700;color:#22c55e;">'+pv.toLocaleString()+'</td><td style="color:#f59e0b;">'+rc.toLocaleString()+'</td><td style="color:#64748b;font-size:12px;">'+ls+'</td></tr>';
    }).join('');

    document.getElementById('last-updated').textContent = ' · 更新: '+new Date().toLocaleTimeString('ja-JP');
    document.getElementById('loading-area').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  } catch(e) {
    document.getElementById('loading-area').innerHTML = '<p style="color:#f87171;">エラー: '+e.message+'</p>';
  }
};

if (sessionStorage.getItem('admin_auth') === '1') loadDashboard();
</script>
</body>
</html>
