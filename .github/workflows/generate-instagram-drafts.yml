name: Generate Instagram Drafts

on:
  workflow_dispatch:
  schedule:
    - cron: "10 1 * * 5"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate Instagram drafts
        run: node generate-instagram-drafts.js
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Generate Instagram drafts"
          file_pattern: instagram-drafts.json
