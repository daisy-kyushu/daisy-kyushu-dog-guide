*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 5%,rgba(207,238,224,.55) 0 130px,transparent 131px),var(--bg);color:var(--brown);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.75}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}.site-header{position:sticky;top:0;z-index:10;background:rgba(255,253,248,.95);border-bottom:1px solid var(--line);padding:14px 5vw;display:flex;gap:18px;justify-content:space-between;align-items:center}.brand{font-weight:800;color:var(--brown)}nav{display:flex;gap:8px;flex-wrap:wrap}nav a{font-size:13px;padding:7px 9px;border-radius:99px}nav a:hover{background:var(--cream);text-decoration:none}main{width:min(1120px,calc(100% - 32px));margin:0 auto}.hero{margin:30px 0 22px;padding:clamp(24px,5vw,52px);border-radius:36px;background:linear-gradient(135deg,var(--mint),var(--cream));box-shadow:var(--shadow)}.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.1;margin:0 0 12px}.notice{background:#fff1ed;border:1px solid #f0c7bd;border-radius:16px;padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.panel{margin:24px 0;padding:24px}.tag{display:inline-block;background:var(--cream);border-radius:99px;padding:5px 10px;margin:4px;font-size:13px}.tag.warn{background:#ffe9e4;color:#85443b}.tag.ok{background:var(--mint);color:#315f48}.button{display:inline-block;background:var(--green);color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;margin:6px 6px 0 0}.button.sub{background:#fff;color:var(--brown);border:1px solid var(--line)}.media{height:140px;display:grid;place-items:center;font-size:46px;background:var(--cream);border-radius:18px;margin-bottom:12px;overflow:hidden}.media img{width:100%;height:100%;object-fit:cover;display:block}.product-placeholder{height:130px;display:grid;place-items:center;font-size:42px;background:var(--cream);border-radius:18px;margin-bottom:12px}footer{margin-top:50px;padding:28px 5vw;border-top:1px solid var(--line);background:#fff;color:var(--muted)}@media(max-width:900px){.site-header{display:block}.grid,.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid,.grid4{grid-template-columns:1fr}.hero h1{font-size:36px}main{width:min(100% - 20px,1120px)}}

body{font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.82}.brand,h1,h2,h3{font-family:"Zen Maru Gothic","Noto Sans JP",sans-serif;letter-spacing:.02em}.brand,h1{font-weight:900}h2,h3{font-weight:700;margin-top:0;margin-bottom:.72em}h2{line-height:1.38}h3{line-height:1.5}p,li{line-height:1.9}nav a,.button,.tag{font-family:"Noto Sans JP",system-ui,sans-serif;font-weight:700}nav a{font-size:14px;letter-spacing:.01em}.hero h1{letter-spacing:.03em;text-wrap:balance}.card h2,.card h3{line-height:1.48}.card p{font-size:.98rem}.button{font-size:14px;letter-spacing:.015em}.tag{font-size:13px;padding:6px 11px}.section h2,.panel h2{padding-bottom:.3em}.section h2::after,.panel h2::after{content:"";display:block;width:3.2rem;height:4px;border-radius:999px;background:rgba(79,140,107,.25);margin-top:.45em}@media(max-width:560px){body{line-height:1.92}nav a{font-size:14px;padding:8px 10px}.hero h1{font-size:clamp(31px,10vw,38px);line-height:1.22}h2{font-size:1.32rem}h3{font-size:1.08rem}.card p{font-size:1rem}.tag{font-size:13px;padding:6px 10px}.button{font-size:14px;padding:10px 15px}}
</style></head><body><header class="site-header"><a class="brand" href="index.html">🐾 Daisy Kyushu Dog Guide</a><nav><a href="index.html">ホーム</a><a href="weekend.html">今週末</a><a href="spots.html">スポット</a><a href="outdoor.html">アウトドア</a><a href="map.html">地図</a><a href="hotels.html">ホテル</a><a href="events.html">イベント</a><a href="checklist.html">持ち物</a><a href="pr.html">PR料金</a><a href="listing.html">掲載希望</a><a href="admin.html">運営管理</a></nav></header><main><section class="hero"><h1>イベント情報</h1><p>今後開催予定の犬連れイベントを表示します。</p><p class="notice">イベント情報は変更・中止になる場合があります。参加前に公式情報をご確認ください。</p></section><section id="events-list" class="grid"></section></main><footer><strong>Daisy Kyushu Dog Guide</strong><p>九州犬連れおでかけ情報メディア。※本サイトにはアフィリエイト広告を含みます。</p></footer><script>

async function fetchJson(path,fallback=[]){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return await r.json()}catch(e){console.warn(e);return fallback}}
function e(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function maps(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q||'')}
function productUrl(p){return p?.rakutenAffiliateUrl||p?.normalUrl||''}
function matchProducts(item,products){
 const text=`${item.type||''} ${item.category||''} ${item.name||''} ${item.title||''} ${item.memo||''}`;
 const picks=[];
 const has=(...w)=>w.some(x=>text.includes(x));
 const by=(keys)=>products.find(p=>!picks.includes(p)&&keys.some(k=>`${p.productName||''} ${p.category||''} ${p.searchKeyword||''}`.includes(k))&&productUrl(p));
 if(has('キャンプ'))['折りたたみ','給水','虫よけ','シート','ボウル'].forEach(k=>{const p=by([k]);if(p)picks.push(p)});
 if(has('散歩','高原','公園'))['ハーネス','給水','クール','うんち','消臭'].forEach(k=>{const p=by([k]);if(p)picks.push(p)});
 if(has('イベント'))['カート','給水','マナー','暑さ','消臭'].forEach(k=>{const p=by([k]);if(p)picks.push(p)});
 if(has('雨','室内'))['レイン','タオル','マット'].forEach(k=>{const p=by([k]);if(p)picks.push(p)});
 if(String(item.largeDog||'').includes('要確認')||text.includes('大型犬'))['大型犬','ハーネス','ロングリード','シート'].forEach(k=>{const p=by([k]);if(p)picks.push(p)});
 return picks.slice(0,3);
}
function productBlock(list){if(!list.length)return '<p class="notice">関連グッズは準備中です。</p>';return `<h3>このおでかけにあると便利</h3><div>${list.map(p=>`<article class="card" style="padding:12px;margin:8px 0"><strong>${e(p.productName)}</strong><div><span class="tag">${e(p.category||'グッズ')}</span></div>${productUrl(p)?`<a class="button" href="${e(productUrl(p))}" target="_blank" rel="noopener">楽天で見る</a>`:''}</article>`).join('')}</div><p class="notice">価格・在庫・仕様は変更される場合があります。購入前に楽天市場の商品ページで最新情報を確認してください。</p>`}
function ensureModal(){if(document.getElementById('detail-modal'))return;const m=document.createElement('div');m.id='detail-modal';m.style.cssText='position:fixed;inset:0;background:rgba(30,25,20,.45);display:none;z-index:99;padding:14px;overflow:auto';m.innerHTML='<div style="max-width:760px;margin:28px auto;background:#fffdf8;border-radius:24px;padding:18px;border:1px solid #efe4d5;box-shadow:0 18px 45px rgba(84,66,45,.18)"><button id="close-detail" class="button sub" style="float:right">閉じる ✕</button><div id="modal-body" style="clear:both"></div></div>';document.body.appendChild(m);m.addEventListener('click',ev=>{if(ev.target.id==='detail-modal')m.style.display='none'});document.getElementById('close-detail').onclick=()=>m.style.display='none'}
function openModal(html){ensureModal();document.getElementById('modal-body').innerHTML=html;document.getElementById('detail-modal').style.display='block'}

async function renderEvents(){const el=document.getElementById('events-list');if(!el)return;const [events,products]=await Promise.all([fetchJson('events.json'),fetchJson('products.json')]);
el.innerHTML=events.map((ev,i)=>`<article class="card"><h2>${e(ev.name||ev.title)}</h2><p><span class="tag">開催日：${e(ev.eventDate||ev.date||'要確認')}</span><span class="tag">エリア：${e(ev.area||'要確認')}</span><span class="tag">会場：${e(ev.venue||'要確認')}</span></p><p>${e(ev.memo||'')}</p><button class="button js-detail" data-i="${i}">詳細を見る</button></article>`).join('');
[...el.querySelectorAll('.js-detail')].forEach(b=>b.onclick=()=>{const ev=events[+b.dataset.i],items=matchProducts({...ev,type:'イベント',category:'イベント'},products);const official=ev.officialUrl?`<a class="button" href="${e(ev.officialUrl)}" target="_blank" rel="noopener">公式情報</a>`:'';const sns=ev.snsUrl||ev.officialSnsUrl?`<a class="button sub" href="${e(ev.snsUrl||ev.officialSnsUrl)}" target="_blank" rel="noopener">Instagram/SNS</a>`:'';openModal(`<h2>${e(ev.name||ev.title)}</h2><p><span class="tag warn">開催日：${e(ev.eventDate||ev.date||'要確認')}</span><span class="tag">エリア：${e(ev.area||'要確認')}</span><span class="tag">会場：${e(ev.venue||'要確認')}</span><span class="tag">犬同伴条件：${e(ev.dogPolicy||ev.dogRules||'要確認')}</span><span class="tag">status：${e(ev.status||'要確認')}</span></p><p>${e(ev.memo||'')}</p><div>${official}${sns}<a class="button sub" href="${e(maps(ev.mapQuery||ev.venue||ev.name))}" target="_blank" rel="noopener">地図で見る</a></div><p class="notice">開催日・会場・犬同伴条件は変更される場合があります。来場前に必ず公式情報を確認してください。</p>${productBlock(items)}`)})}
document.addEventListener('DOMContentLoaded',renderEvents)

</script></body></html>
