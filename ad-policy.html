:root{--bg:#fffdf8;--cream:#fff4df;--mint:#cfeee0;--green:#4f8c6b;--brown:#44352a;--muted:#7d7168;--line:#efe4d5;--shadow:0 18px 45px rgba(84,66,45,.12);--radius:28px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 5%,rgba(207,238,224,.55) 0 130px,transparent 131px),var(--bg);color:var(--brown);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.75}a{color:var(--green);text-decoration:none}a:hover{text-decoration:underline}.site-header{position:sticky;top:0;z-index:10;background:rgba(255,253,248,.95);border-bottom:1px solid var(--line);padding:14px 5vw;display:flex;gap:18px;justify-content:space-between;align-items:center}.brand{font-weight:800;color:var(--brown)}nav{display:flex;gap:8px;flex-wrap:wrap}nav a{font-size:13px;padding:7px 9px;border-radius:99px}nav a:hover{background:var(--cream);text-decoration:none}main{width:min(1120px,calc(100% - 32px));margin:0 auto}.hero{margin:30px 0 22px;padding:clamp(24px,5vw,52px);border-radius:36px;background:linear-gradient(135deg,var(--mint),var(--cream));box-shadow:var(--shadow)}.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.1;margin:0 0 12px}.notice{background:#fff1ed;border:1px solid #f0c7bd;border-radius:16px;padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.panel{margin:24px 0;padding:24px}.tag{display:inline-block;background:var(--cream);border-radius:99px;padding:5px 10px;margin:4px;font-size:13px}.tag.warn{background:#ffe9e4;color:#85443b}.tag.ok{background:var(--mint);color:#315f48}.button{display:inline-block;background:var(--green);color:#fff;padding:10px 16px;border-radius:99px;font-weight:700;margin:6px 6px 0 0}.button.sub{background:#fff;color:var(--brown);border:1px solid var(--line)}.product-placeholder{height:130px;display:grid;place-items:center;font-size:42px;background:var(--cream);border-radius:18px;margin-bottom:12px}footer{margin-top:50px;padding:28px 5vw;border-top:1px solid var(--line);background:#fff;color:var(--muted)}@media(max-width:900px){.site-header{display:block}.grid,.grid4{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid,.grid4{grid-template-columns:1fr}.hero h1{font-size:36px}main{width:min(100% - 20px,1120px)}}</style></head><body><header class="site-header"><a class="brand" href="index.html">🐾 Daisy Kyushu Dog Guide</a>    <nav class="site-nav">

    </nav></header><main><section class="hero"><h1>広告・PRポリシー</h1><p class="notice">本サイトにはアフィリエイト広告を含みます。</p></section><section class="panel"><p>提供や報酬を伴う掲載は、広告・PRであることが分かるように表記します。価格・在庫・施設条件は変更される場合があります。</p></section></main><footer><strong>Daisy Kyushu Dog Guide</strong><p>九州犬連れおでかけ情報メディア。※本サイトにはアフィリエイト広告を含みます。</p></footer><script>
async function fetchJson(path,fallback=[]){try{const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error(path);return await r.json()}catch(e){console.warn(e);return fallback}}function e(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function maps(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q||'')}function tagLine(s){return `<span class="tag">エリア：${e(s.area)}</span><span class="tag">種別：${e(s.type||'')}</span><span class="tag warn">大型犬：${e(s.largeDog||'要確認')}</span><span class="tag">雨の日：${e(s.rainyOk||'要確認')}</span><span class="tag">室内：${e(s.indoorOk||'要確認')}</span><span class="tag ok">確認：${e(s.lastChecked||'要確認')}</span>`}
async function renderPlaces(file,target,weekend=false){const el=document.getElementById(target);if(!el)return;let list=await fetchJson(file);if(weekend)list=list.filter(x=>x.weekendRecommended);el.innerHTML=list.map(s=>`<article class="card"><h2>${e(s.name)}</h2><p>${e(s.memo||'')}</p><p>${tagLine(s)}</p><p class="notice">行く前に公式サイト・公式SNSで最新情報を確認してください。</p><a class="button" href="${e(s.officialUrl)}" target="_blank" rel="noopener">公式情報</a><a class="button sub" href="${e(maps(s.mapQuery||s.name))}" target="_blank" rel="noopener">地図で見る</a></article>`).join('')}
async function renderHotels(){const el=document.getElementById('hotels-list');if(!el)return;const hotels=await fetchJson('hotels.json');el.innerHTML=hotels.map(h=>`<article class="card"><h2>${e(h.name)}</h2><p class="notice">${e(h.memo)}</p><p><span class="tag">エリア：${e(h.area)}</span><span class="tag">犬サイズ：${e(h.dogSize)}</span><span class="tag">客室：${e(h.roomWithDog)}</span><span class="tag ok">確認：${e(h.lastChecked)}</span></p><p><strong>検索ワード例：</strong>${e(h.searchKeyword)}</p><a class="button" href="${e(h.rakutenTravelUrl)}" target="_blank" rel="noopener">楽天トラベルを開く</a></article>`).join('')}
function eventEnd(d){const m=String(d||'').match(/\d{4}-\d{2}-\d{2}/g);return m?m[m.length-1]:''}async function renderEvents(){const el=document.getElementById('events-list');if(!el)return;const today=new Date().toISOString().slice(0,10);const events=(await fetchJson('events.json')).filter(ev=>(eventEnd(ev.date)||'9999')>=today);el.innerHTML=events.length?events.map(ev=>`<article class="card"><h2>${e(ev.name)}</h2><p><span class="tag warn">開催日：${e(ev.date)}</span><span class="tag">エリア：${e(ev.area)}</span><span class="tag">会場：${e(ev.venue)}</span></p><p>${e(ev.memo)}</p><p class="notice">イベント情報は変更・中止になる場合があります。参加前に公式情報をご確認ください。</p><a class="button" href="${e(ev.officialUrl)}" target="_blank" rel="noopener">公式サイト</a><a class="button sub" href="${e(ev.officialSnsUrl)}" target="_blank" rel="noopener">公式SNS</a></article>`).join(''):'<article class="card"><h2>今後のイベントは準備中です</h2><p>確認でき次第、公式URL付きで追加します。</p></article>'}
function productCard(p){const url=p.rakutenAffiliateUrl||p.normalUrl||('https://search.rakuten.co.jp/search/mall/'+encodeURIComponent(p.searchKeyword||p.productName)+'/');return `<article class="card"><div class="product-placeholder">🐾</div><h2>${e(p.productName)}</h2><p>${e(p.whyCandidate)}</p><p><span class="tag">${e(p.category)}</span><span class="tag ok">確認：${e(p.lastChecked)}</span></p><a class="button" href="${e(url)}" target="_blank" rel="noopener">楽天で探す</a></article>`}async function renderProducts(target='products-list',limit=99){const el=document.getElementById(target);if(!el)return;const products=await fetchJson('products.json');el.innerHTML=products.slice(0,limit).map(productCard).join('')}function diagnosis(){const el=document.getElementById('diagnosis');if(!el)return;el.innerHTML='<article class="card"><h2>Daisyおすすめ診断</h2><p>大型犬・車移動・抜け毛対策なら、車用シートカバー、吸水タオル、マナー袋がおすすめ候補です。</p><a class="button" href="checklist.html">おすすめグッズを見る</a></article>'}
document.addEventListener('DOMContentLoaded',()=>{renderPlaces('spots.json','spots-list');renderPlaces('spots.json','weekend-list',true);renderPlaces('outdoor.json','outdoor-list');renderPlaces('spots.json','map-list');renderHotels();renderEvents();renderProducts('products-list');renderProducts('product-banners',8);diagnosis()})</script>
  <!-- Firebase Tracker -->
  <script type="module">
    import { initTracker } from "firebase-tracker.js";
    initTracker(document.title);
  </script>
  <script type="module">
    import { trackRakutenClick } from "firebase-tracker.js";
    // 動的に生成される楽天リンクを監視してクリック計測
    const observer = new MutationObserver(() => {
      document.querySelectorAll('a[href*="rakuten"]:not([data-rk-tracked]), a[href*="hb.afl"]:not([data-rk-tracked])').forEach(link => {
        link.dataset.rkTracked = "1";
        const href = link.href;
        const hotelMatch = href.match(/HOTEL\/(\d+)/);
        let itemId = hotelMatch ? `hotel_${hotelMatch[1]}` : `rk_${href.slice(-20).replace(/[^a-z0-9]/gi,'_')}`;
        let itemTitle = link.closest('[data-hotel-name]')?.dataset.hotelName || link.textContent.trim() || itemId;
        let itemType = hotelMatch ? 'hotel' : (link.closest('.rk-banner') ? 'banner' : 'product');
        link.addEventListener('click', () => trackRakutenClick(itemId, itemTitle, itemType));
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
    // 初回実行
    document.querySelectorAll('a[href*="rakuten"]:not([data-rk-tracked]), a[href*="hb.afl"]:not([data-rk-tracked])').forEach(link => {
      link.dataset.rkTracked = "1";
      const href = link.href;
      const hotelMatch = href.match(/HOTEL\/(\d+)/);
      let itemId = hotelMatch ? `hotel_${hotelMatch[1]}` : `rk_${href.slice(-20).replace(/[^a-z0-9]/gi,'_')}`;
      let itemTitle = link.closest('[data-hotel-name]')?.dataset.hotelName || link.textContent.trim() || itemId;
      let itemType = hotelMatch ? 'hotel' : (link.closest('.rk-banner') ? 'banner' : 'product');
      link.addEventListener('click', () => trackRakutenClick(itemId, itemTitle, itemType));
    });
  </script>
